$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://spec.openapis.org/lifecycle/1.0/schema/WORK-IN-PROGRESS'
title: Lifecycle Schema
description: Validates a Lifecycle Object.

$ref: '#/$defs/lifecycle'

$defs:
  lifecycle:
    description: Deprecation and sunset status of a single operation.
    type: object
    required:
      - deprecation
    properties:
      deprecation:
        $ref: '#/$defs/deprecation'
      sunset:
        $ref: '#/$defs/sunset'
    unevaluatedProperties: false

  deprecation:
    description: When and why an operation is deprecated, and what replaces it.
    type: object
    required:
      - date
    properties:
      date:
        type: string
        format: date-time
      reason:
        type: string
      infoLink:
        $ref: '#/$defs/link'
      successorLink:
        $ref: '#/$defs/link'
      externalLinks:
        $ref: '#/$defs/external-links'
    unevaluatedProperties: false

  sunset:
    description: When an operation is expected to stop accepting requests.
    type: object
    required:
      - date
    properties:
      date:
        type: string
        format: date-time
      policyLink:
        $ref: '#/$defs/link'
      externalLinks:
        $ref: '#/$defs/external-links'
    unevaluatedProperties: false

  # A link that maps to a Link header; the relation comes from the field holding it.
  link:
    type: object
    required:
      - url
    properties:
      url:
        type: string
        format: uri-reference
      summary:
        type: string
      description:
        type: string
    $ref: '#/$defs/specification-extensions'
    unevaluatedProperties: false

  external-links:
    type: array
    items:
      $ref: '#/$defs/external-documentation'

  # External Documentation Object as extended by the OAS Docs Links proposal.
  external-documentation:
    type: object
    required:
      - url
    properties:
      summary:
        type: string
      description:
        type: string
      url:
        type: string
        format: uri-reference
      kind:
        type: string
    $ref: '#/$defs/specification-extensions'
    unevaluatedProperties: false

  specification-extensions:
    patternProperties:
      '^x-': true
